<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>60s Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=47">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23FFD23F'/><text x='16' y='22' font-size='14' font-family='Arial Black' text-anchor='middle' fill='%23111'>60</text></svg>">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/"><span class="brand-badge">60</span><span class="brand-name">Studio</span></a>
  <div class="topbar-right">
    <label class="who">
      <span class="who-label">Ben:</span>
      <select id="userSelect" aria-label="Kullanıcı"></select>
    </label>
    <button class="worker-pill" id="workerState" hidden></button>
    <a class="icon-btn yt-link" id="ytChannel" href="#" target="_blank" rel="noopener" title="YouTube kanalımız" aria-label="YouTube kanalımız" hidden></a>
    <a class="icon-btn drive-link" id="driveRoot" href="#" target="_blank" rel="noopener" title="Ortak Drive klasörü" aria-label="Ortak Drive klasörü" hidden></a>
    <a class="icon-btn" href="#/integrations" title="Entegrasyonlar (API anahtarları)" aria-label="Entegrasyonlar">🔌</a>
    <div class="vol-wrap">
      <button class="icon-btn" id="volBtn" title="Önizleme ses düzeyi" aria-label="Önizleme ses düzeyi">🔊</button>
      <div class="vol-pop" id="volPop" hidden>
        <div class="small muted">Önizleme sesi (tüm videolar)</div>
        <input type="range" id="volRange" min="0" max="100" step="5" aria-label="Ses düzeyi">
        <button class="btn small" id="volMute">Sessiz / aç</button>
      </div>
    </div>
    <button class="icon-btn" id="settingsBtn" title="Ayarlar" aria-label="Ayarlar">⚙</button>
  </div>
</header>
<main id="app" class="container"></main>
<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="Kapat">×</button>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<button id="verBadge" class="ver-badge" hidden></button>
<div id="newVersion" class="new-version" hidden></div>
<script src="app.js?v=47"></script>
</body>
</html>
